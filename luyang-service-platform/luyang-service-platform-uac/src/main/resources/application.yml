spring:
  application:
    name: luyang-service-platform-uac
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}/platform_contact?autoReconnect=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_NAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 5 # 最小空闲连接数量
      idle-timeout: 600000 # 空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 10 # 连接池最大连接数，默认是10
      auto-commit: true # 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      pool-name: MyHikariCP # 连接池母子
      max-lifetime: 1800000 # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 # 数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1
  data:
    redis:
      database: 0
      host: 106.55.107.106
      password: luyang@redis
      port: 6379
      timeout: 10000 # 连接超时时间
      lettuce:
        pool:
          max-active: 8 # 连接池最大连接数 使用负值表示没有限制
          max-idle: 8 # 连接池中的最大空闲连接
          max-wait: 10000 # 连接池最大阻塞等待时间 使用负值表示没有限制
          min-idle: 0 # 连接池中的最小空闲连接
        shutdown-timeout: 100 # 关闭超时时间

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
